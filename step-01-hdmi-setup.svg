<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <!-- Background & Studio Lighting Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbfbfa"/>
      <stop offset="100%" stop-color="#f1f1ed"/>
    </linearGradient>

    <!-- Aluminum Material Gradients (Apple Silver Finish) -->
    <linearGradient id="macTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <linearGradient id="macSideFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <linearGradient id="macSideRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <!-- Display Aluminum Frame -->
    <linearGradient id="standArm" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <linearGradient id="standBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Monitor Screen Gradient (macOS Desktop Wallpaper) -->
    <linearGradient id="screenDisplay" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="30%" stop-color="#2563eb"/>
      <stop offset="65%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>

    <linearGradient id="screenReflection" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- HDMI Cable Gradient -->
    <linearGradient id="hdmiCable" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="40%" stop-color="#334155"/>
      <stop offset="80%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="hdmiGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dx="0" dy="12" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.10"/>
      </feComponentTransfer>
      <feMerge> 
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="deepShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16"/>
      <feOffset dx="0" dy="18" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.14"/>
      </feComponentTransfer>
      <feMerge> 
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Backdrop -->
  <rect width="100%" height="100%" rx="16" fill="url(#bgGrad)"/>

  <!-- Subtle Studio Grid Accents -->
  <g opacity="0.45" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,6">
    <line x1="120" y1="100" x2="440" y2="260" />
    <line x1="240" y1="80" x2="560" y2="240" />
    <line x1="520" y1="220" x2="840" y2="380" />
    <line x1="200" y1="300" x2="520" y2="460" />
    <line x1="440" y1="260" x2="120" y2="420" />
    <line x1="680" y1="240" x2="360" y2="400" />
    <line x1="840" y1="260" x2="520" y2="420" />
  </g>

  <!-- ========================================== -->
  <!-- 1. AMBIENT SHADOWS ON DESK                 -->
  <!-- ========================================== -->
  <ellipse cx="630" cy="420" rx="145" ry="36" fill="#000" opacity="0.09" filter="url(#softShadow)"/>
  <ellipse cx="275" cy="390" rx="105" ry="30" fill="#000" opacity="0.09" filter="url(#softShadow)"/>
  <ellipse cx="480" cy="445" rx="65" ry="16" fill="#000" opacity="0.06" filter="url(#softShadow)"/>

  <!-- ========================================== -->
  <!-- 2. EXTERNAL MONITOR (RIGHT SIDE)           -->
  <!-- ========================================== -->
  <g id="externalMonitor" filter="url(#deepShadow)">
    <!-- Monitor Stand Base -->
    <path d="M 550,400 L 670,345 L 720,370 L 600,425 Z" fill="url(#standBase)" stroke="#cbd5e1" stroke-width="1" />
    <path d="M 600,425 L 720,370 L 720,376 L 600,431 Z" fill="#94a3b8" />
    <path d="M 550,400 L 600,425 L 600,431 L 550,406 Z" fill="#64748b" />

    <!-- Stand Column -->
    <path d="M 622,365 L 642,356 L 642,230 L 622,239 Z" fill="url(#standArm)" />
    <path d="M 642,356 L 650,360 L 650,234 L 642,230 Z" fill="#94a3b8" />

    <!-- Display Enclosure (Isometric Angled Face) -->
    <path d="M 460,90 L 780,120 L 780,310 L 460,280 Z" fill="#1e293b" rx="10" />
    <path d="M 454,85 L 786,115 L 786,315 L 454,285 Z" fill="#334155" rx="12" stroke="#475569" stroke-width="2" />

    <!-- Active Screen -->
    <path d="M 464,95 L 776,124 L 776,305 L 464,276 Z" fill="url(#screenDisplay)" />

    <!-- Screen Glass Sheen -->
    <path d="M 464,95 L 776,124 L 620,305 L 464,276 Z" fill="url(#screenReflection)" />

    <!-- macOS UI Simulation on Screen -->
    <path d="M 464,95 L 776,124 L 776,134 L 464,105 Z" fill="rgba(0,0,0,0.35)" />
    <circle cx="476" cy="102" r="2.5" fill="#ef4444" />
    <circle cx="484" cy="103" r="2.5" fill="#f59e0b" />
    <circle cx="492" cy="104" r="2.5" fill="#10b981" />

    <!-- Simulated macOS Desktop Window -->
    <g opacity="0.95">
      <path d="M 500,140 L 740,162 L 740,270 L 500,248 Z" fill="rgba(255,255,255,0.92)" stroke="rgba(255,255,255,0.6)" stroke-width="1" />
      <path d="M 500,140 L 740,162 L 740,175 L 500,153 Z" fill="#f1f5f9" />
      <text x="520" y="150" font-family="-apple-system, Inter, sans-serif" font-size="8.5" font-weight="600" fill="#334155" transform="rotate(5.2, 500, 140)">macOS Desktop — HDMI Display Connected</text>

      <rect x="525" y="175" width="90" height="8" rx="2" fill="#e2e8f0" transform="rotate(5.2, 500, 140)"/>
      <rect x="525" y="190" width="140" height="6" rx="2" fill="#cbd5e1" transform="rotate(5.2, 500, 140)"/>
      <rect x="525" y="202" width="120" height="6" rx="2" fill="#e2e8f0" transform="rotate(5.2, 500, 140)"/>
    </g>

    <!-- Monitor Badge / Indicator -->
    <g transform="translate(745, 138)">
      <rect width="42" height="16" rx="4" fill="#10b981" opacity="0.95"/>
      <text x="5" y="11" font-family="-apple-system, Inter, sans-serif" font-size="7.5" font-weight="700" fill="#ffffff">HDMI 1</text>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- 3. HDMI CABLE (ROUTED BETWEEN DEVICES)     -->
  <!-- ========================================== -->
  <!-- Floor shadow of cable -->
  <path d="M 340,345 Q 395,435 480,422 T 575,342" fill="none" stroke="rgba(0,0,0,0.12)" stroke-width="10" stroke-linecap="round" filter="url(#softShadow)"/>

  <!-- Cable main body -->
  <path d="M 340,332 Q 395,420 480,410 T 575,330" fill="none" stroke="url(#hdmiCable)" stroke-width="8" stroke-linecap="round"/>
  <!-- Cable 3D sheen -->
  <path d="M 340,330 Q 395,418 480,408 T 575,328" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- HDMI Connector at Mac mini end -->
  <g transform="translate(330, 322)">
    <path d="M 0,5 L 14,-2 L 18,6 L 4,13 Z" fill="url(#hdmiGold)" />
    <path d="M 8,0 L 22,-7 L 26,4 L 12,11 Z" fill="#1e293b" stroke="#334155" stroke-width="1" rx="2" />
  </g>

  <!-- HDMI Connector at Monitor end -->
  <g transform="translate(570, 320)">
    <path d="M 0,8 L 12,2 L 15,10 L 3,16 Z" fill="url(#hdmiGold)" />
    <path d="M 6,3 L 18,-3 L 21,7 L 9,13 Z" fill="#1e293b" stroke="#334155" stroke-width="1" rx="2" />
  </g>

  <!-- Signal Pulses on Cable -->
  <circle cx="425" cy="398" r="3.5" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="480" cy="410" r="3.5" fill="#38bdf8" filter="url(#glow)"/>

  <!-- ========================================== -->
  <!-- 4. MAC MINI M4 (LEFT SIDE)                 -->
  <!-- ========================================== -->
  <g id="macMiniM4" filter="url(#deepShadow)">
    <!-- Bottom Base Chamfer -->
    <path d="M 190,320 L 290,270 L 360,305 L 260,355 Z" fill="#475569" />

    <!-- Left Front Side Wall -->
    <path d="M 190,290 L 260,325 L 260,355 L 190,320 Z" fill="url(#macSideFront)" stroke="#94a3b8" stroke-width="0.5"/>

    <!-- Right Rear Side Wall (With ports) -->
    <path d="M 260,325 L 360,275 L 360,305 L 260,355 Z" fill="url(#macSideRight)" stroke="#64748b" stroke-width="0.5"/>

    <!-- Rear Ports on Right Face -->
    <ellipse cx="280" cy="330" rx="3" ry="5" fill="#0f172a" transform="rotate(-26, 280, 330)"/>
    <rect x="295" y="317" width="8" height="6" rx="1" fill="#0f172a" transform="rotate(-26, 295, 317)"/>
    <rect x="315" y="307" width="10" height="5" rx="1" fill="#0284c7" stroke="#38bdf8" stroke-width="1" transform="rotate(-26, 315, 307)"/>
    <text x="310" y="298" font-family="-apple-system, Inter, sans-serif" font-size="6.5" font-weight="700" fill="#38bdf8">HDMI</text>

    <!-- Top Face (Aluminum silver finish) -->
    <path d="M 190,290 L 290,240 L 360,275 L 260,325 Z" fill="url(#macTop)" stroke="#f8fafc" stroke-width="1.5" />

    <!-- Apple Logo -->
    <path d="M 276,277 C 275,274 277,272 279,271 C 281,273 280,276 278,277 Z M 274,277 C 272,277 270,279 270,282 C 270,286 274,289 275,289 C 276,289 277,288 278,288 C 279,288 280,289 281,289 C 282,289 286,285 285,282 C 284,281 282,280 280,280 C 278,280 276,277 274,277 Z" fill="#64748b" opacity="0.5" transform="rotate(-5, 275, 282)"/>

    <!-- Front Status LED -->
    <circle cx="220" cy="313" r="1.8" fill="#ffffff" filter="url(#glow)"/>
  </g>

  <!-- ========================================== -->
  <!-- 5. KEYBOARD & MOUSE (ACCESSORIES)          -->
  <!-- ========================================== -->
  <g id="keyboard" opacity="0.9">
    <path d="M 460,365 L 540,325 L 575,342 L 495,382 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <path d="M 495,382 L 575,342 L 575,347 L 495,387 Z" fill="#94a3b8" />
    <path d="M 460,365 L 495,382 L 495,387 L 460,370 Z" fill="#cbd5e1" />
    <path d="M 472,363 L 536,331 M 478,367 L 542,335 M 484,371 L 548,339 M 490,375 L 554,343" stroke="#e2e8f0" stroke-width="1.5" />
  </g>

  <g id="mouse" opacity="0.9">
    <ellipse cx="605" cy="355" rx="14" ry="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" transform="rotate(-35, 605, 355)"/>
    <ellipse cx="603" cy="353" rx="12" ry="20" fill="#ffffff" opacity="0.7" transform="rotate(-35, 605, 355)"/>
  </g>

  <!-- ========================================== -->
  <!-- 6. EDITORIAL LABELS & POINTERS             -->
  <!-- ========================================== -->
  <!-- Mac mini M4 Badge -->
  <g id="badgeMacMini">
    <rect x="130" y="190" width="115" height="28" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#softShadow)"/>
    <circle cx="145" cy="204" r="4" fill="#64748b"/>
    <text x="157" y="208" font-family="-apple-system, Inter, sans-serif" font-size="11.5" font-weight="600" fill="#0f172a">Mac mini M4</text>
    <!-- Pointer from badge to Mac mini -->
    <path d="M 187,218 L 187,245 L 235,270" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,3"/>
  </g>

  <!-- HDMI Cable Badge -->
  <g id="badgeHdmiCable">
    <rect x="410" y="460" width="145" height="32" rx="16" fill="#111827" stroke="#334155" stroke-width="1" filter="url(#softShadow)"/>
    <circle cx="428" cy="476" r="4" fill="#38bdf8" filter="url(#glow)"/>
    <text x="442" y="480" font-family="-apple-system, Inter, sans-serif" font-size="11.5" font-weight="600" fill="#f8fafc">HDMI Cable</text>
    <text x="516" y="480" font-family="-apple-system, Inter, sans-serif" font-size="10" font-weight="500" fill="#94a3b8">(Temp)</text>
    <!-- Pointer from badge to HDMI Cable curve -->
    <path d="M 482,460 L 482,416" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="3,3"/>
  </g>

  <!-- Temporary Monitor Badge -->
  <g id="badgeMonitor">
    <rect x="695" y="55" width="155" height="28" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#softShadow)"/>
    <circle cx="710" cy="69" r="4" fill="#10b981"/>
    <text x="722" y="73" font-family="-apple-system, Inter, sans-serif" font-size="11.5" font-weight="600" fill="#0f172a">Temporary Monitor</text>
    <!-- Pointer from badge to Monitor top -->
    <path d="M 695,69 L 665,69 L 640,95" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,3"/>
  </g>
</svg>